<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  :root { --brand: #1f3d2b; --brand: {{brand_color}}; --accent: #c9a24b; --accent: {{accent_color}}; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; }
  body { font-family: "Inter", -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif; color: #fff; background: var(--brand); overflow: hidden; }
  .card { width: 100%; height: 100%; display: flex; flex-direction: column; }
  .photo { position: relative; flex: 0 0 56%; overflow: hidden; }
  .photo img.main { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .logo { position: absolute; top: 44px; right: 52px; height: 60px; max-width: 240px; object-fit: contain; filter: drop-shadow(0 2px 8px rgba(0,0,0,.35)); }
  .panel { position: relative; flex: 1; display: flex; flex-direction: column; padding: 46px 56px 36px; }
  .panel::before { content: ""; position: absolute; left: 56px; top: 0; width: 120px; height: 6px; background: var(--accent); }
  .kicker { font-size: 24px; font-weight: 700; letter-spacing: .24em; text-transform: uppercase; color: var(--accent); }
  .when { margin-top: 10px; font-family: "Iowan Old Style", "Palatino", Georgia, serif; font-size: 72px; line-height: 1.02; }
  .time { margin-top: 6px; font-size: 40px; font-weight: 600; }
  .where { margin-top: 18px; font-size: 28px; opacity: .9; }
  .facts { margin-top: 6px; font-size: 24px; opacity: .75; }
  .facts span + span::before { content: "·"; margin: 0 14px; }
  .agent { margin-top: auto; display: flex; align-items: center; gap: 18px; padding-top: 22px; border-top: 1px solid rgba(255,255,255,.18); }
  .headshot { width: 64px; height: 64px; border-radius: 50%; object-fit: cover; }
  .who { flex: 1; min-width: 0; font-size: 22px; }
  .name { font-weight: 700; font-size: 25px; }
  .brokerage { font-size: 18px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; text-align: right; max-width: 360px; opacity: .85; }

  html.format-story .photo { flex-basis: 60%; }
  html.format-story .panel { padding: 70px 64px 130px; }
  html.format-story .when { font-size: 100px; }
  html.format-story .time { font-size: 54px; }
  html.format-story .where { font-size: 36px; margin-top: 30px; }
  html.format-story .facts { font-size: 30px; }
  html.format-story .headshot { width: 88px; height: 88px; }
  html.format-story .who { font-size: 28px; }
  html.format-story .name { font-size: 32px; }
  html.format-story .logo { top: 110px; }
  html.format-portrait .photo { flex-basis: 54%; }
  html.format-portrait .when { font-size: 82px; }
</style>
</head>
<body>
<div class="card">
  <div class="photo">
    <img class="main" src="{{photo1}}" alt="">
    <img class="logo" data-if="logo" src="{{logo}}" alt="">
  </div>
  <div class="panel">
    <div class="kicker">{{headline}}</div>
    <div class="when">{{date}}</div>
    <div class="time">{{time}}</div>
    <div class="where">{{address}}<span data-if="city_line">, {{city_line}}</span></div>
    <div class="facts">
      <span data-if="price">{{price}}</span>
      <span data-if="beds">{{beds}} bed</span>
      <span data-if="baths">{{baths}} bath</span>
      <span data-if="sqft">{{sqft}} sq ft</span>
    </div>
    <div class="agent">
      <img class="headshot" data-if="headshot" src="{{headshot}}" alt="">
      <div class="who"><div class="name">{{agent_name}}</div><div data-if="agent_phone">{{agent_phone}}</div></div>
      <div class="brokerage">{{brokerage}}</div>
    </div>
  </div>
</div>
</body>
</html>
