<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Sample card</title>
<style>
  * { box-sizing: border-box; margin: 0; }
  html, body { width: 100%; height: 100%; }
  body { display: flex; flex-direction: column; background: #f4f1ea; color: #1d1d1b; font-family: "Inter", -apple-system, "Helvetica Neue", Arial, sans-serif; }
  .photo { flex: 1; min-height: 0; background: #d9d4c7; }
  .photo img { display: block; width: 100%; height: 100%; object-fit: cover; }
  .text { padding: 56px 64px 64px; }
  .headline { font-size: 72px; font-weight: 700; letter-spacing: -0.02em; line-height: 1.05; }
  .address { margin-top: 20px; font-size: 36px; font-weight: 500; color: #4a4843; }
</style>
</head>
<body>
  <div class="photo" data-if="photo1"><img src="{{photo1}}" alt=""></div>
  <div class="text">
    <h1 class="headline" data-if="headline">{{headline}}</h1>
    <p class="address" data-if="address">{{address}}</p>
  </div>
</body>
</html>
