<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  :root { --brand: #16233f; --brand: {{brand_color}}; --accent: #c9a24b; --accent: {{accent_color}}; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { width: 100%; height: 100%; }
  body { font-family: "Inter", -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif; color: #fff; background: #111; overflow: hidden; }
  .card { position: relative; width: 100%; height: 100%; }
  .card > img.main { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
  .shade { position: absolute; inset: 0; background: linear-gradient(180deg, rgba(0,0,0,.18) 0%, rgba(0,0,0,.35) 45%, rgba(0,0,0,.78) 100%); }
  .frame { position: absolute; inset: 36px; border: 2px solid rgba(255,255,255,.55); }
  .logo { position: absolute; top: 72px; right: 76px; height: 60px; max-width: 240px; object-fit: contain; }
  .center { position: absolute; left: 76px; right: 76px; top: 50%; transform: translateY(-58%); text-align: center; }
  .sold { font-family: "Iowan Old Style", "Palatino", Georgia, serif; font-size: 168px; line-height: .9; letter-spacing: .02em; }
  .rule { width: 120px; height: 5px; background: var(--accent); margin: 30px auto 26px; }
  .address { font-size: 40px; font-weight: 600; }
  .city { margin-top: 6px; font-size: 26px; opacity: .85; }
  .note { margin-top: 22px; font-size: 26px; font-weight: 600; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
  .agent { position: absolute; left: 76px; right: 76px; bottom: 72px; display: flex; align-items: center; gap: 20px; }
  .headshot { width: 76px; height: 76px; border-radius: 50%; object-fit: cover; border: 3px solid #fff; }
  .who { flex: 1; font-size: 22px; }
  .name { font-size: 28px; font-weight: 700; }
  .brokerage { font-size: 19px; font-weight: 600; letter-spacing: .12em; text-transform: uppercase; text-align: right; max-width: 360px; opacity: .9; }

  html.format-story .sold { font-size: 210px; }
  html.format-story .address { font-size: 52px; }
  html.format-story .agent { bottom: 140px; }
  html.format-story .logo { top: 130px; }
</style>
</head>
<body>
<div class="card">
  <img class="main" src="{{photo1}}" alt="">
  <div class="shade"></div>
  <div class="frame"></div>
  <img class="logo" data-if="logo" src="{{logo}}" alt="">
  <div class="center">
    <div class="sold">{{headline}}</div>
    <div class="rule"></div>
    <div class="address">{{address}}</div>
    <div class="city" data-if="city_line">{{city_line}}</div>
    <div class="note" data-if="represented">{{represented}}</div>
  </div>
  <div class="agent">
    <img class="headshot" data-if="headshot" src="{{headshot}}" alt="">
    <div class="who"><div class="name">{{agent_name}}</div><div data-if="agent_phone">{{agent_phone}}</div></div>
    <div class="brokerage">{{brokerage}}</div>
  </div>
</div>
</body>
</html>
